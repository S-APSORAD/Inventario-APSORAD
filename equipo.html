<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Equipo - APSORAD</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-color: #13192B;
      --accent-color: #008080;
      --bg-color: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-dark: #1E293B;
      --text-muted: #64748B;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding-bottom: 50px;
    }

    .navbar-custom {
      background-color: var(--primary-color);
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      padding: 15px 0;
    }

    .brand-logo-wrapper {
      background: #FFFFFF;
      padding: 8px 25px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo-wrapper img {
      max-height: 50px;
      width: auto;
      object-fit: contain;
    }

    .equipment-header {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-top: 30px;
      margin-bottom: 25px;
      border-left: 6px solid var(--accent-color);
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .equipment-title {
      color: var(--primary-color);
      font-weight: 700;
      margin: 0;
    }

    .equipment-badge {
      background-color: #E0F2FE;
      color: #0369A1;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .section-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid #E2E8F0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.02);
      padding: 22px;
      margin-bottom: 20px;
    }

    .section-title {
      color: var(--primary-color);
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid #F1F5F9;
      padding-bottom: 8px;
    }

    .section-title i {
      color: var(--accent-color);
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed #E2E8F0;
    }

    .data-row:last-child {
      border-bottom: none;
    }

    .data-label {
      font-weight: 600;
      color: var(--text-muted);
    }

    .data-value {
      font-weight: 600;
      color: var(--text-dark);
      text-align: right;
    }

    .btn-back {
      background-color: var(--primary-color);
      color: white;
      border-radius: 8px;
      padding: 10px 20px;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-back:hover {
      background-color: var(--accent-color);
      color: white;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-custom">
    <div class="container justify-content-center">
      <div class="brand-logo-wrapper">
        <a href="index.html">
          <img src="logo1.jpg" alt="APSORAD Logo">
        </a>
      </div>
    </div>
  </nav>

  <div class="container" style="max-width: 900px;">
    
    <div class="equipment-header">
      <div>
        <h2 class="equipment-title" id="tipoEquipo">Cargando...</h2>
        <span class="text-muted" id="subtitulo">Consultando Inventario</span>
      </div>
      <div class="mt-2 mt-sm-0">
        <span class="equipment-badge" id="idEquipo">...</span>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6">
        <div class="section-card">
          <div class="section-title">
            <i class="fa-solid fa-circle-info"></i> Información General
          </div>
          <div class="data-row">
            <span class="data-label">Marca:</span>
            <span class="data-value" id="marca">-</span>
          </div>
          <div class="data-row">
            <span class="data-label">Modelo:</span>
            <span class="data-value" id="modelo">-</span>
          </div>
          <div class="data-row">
            <span class="data-label">Asignado a:</span>
            <span class="data-value" id="asignado">-</span>
          </div>
          <div class="data-row">
            <span class="data-label">Activo:</span>
            <span class="data-value" id="activo">-</span>
          </div>
        </div>

        <div class="section-card">
          <div class="section-title">
            <i class="fa-solid fa-clock-rotate-left"></i> Historial de Eventos
          </div>
          <p class="text-muted mb-0" id="historial">-</p>
        </div>
      </div>

      <div class="col-md-6">
        <div class="section-card">
          <div class="section-title">
            <i class="fa-solid fa-microchip"></i> Características Técnicas
          </div>
          <div id="caracteristicas">
            <p class="text-muted">Cargando características...</p>
          </div>
        </div>
      </div>

      <div class="col-12">
        <div class="section-card">
          <div class="section-title">
            <i class="fa-solid fa-desktop"></i> Periféricos
          </div>
          <div class="row">
            <div class="col-md-6">
              <h6 class="fw-bold text-secondary">Monitores:</h6>
              <p class="text-muted mb-0" id="monitores">-</p>
            </div>
            <div class="col-md-6 mt-2 mt-md-0">
              <h6 class="fw-bold text-secondary">Teclado y Mouse:</h6>
              <p class="text-muted mb-0" id="perifericos">-</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="text-center mt-4">
      <!-- Apunta a index.html sin tilde para evitar error 404 -->
      <a href="index.html" class="btn-back">
        <i class="fa-solid fa-arrow-left"></i> Volver al Inventario
      </a>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script>
    const URL_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQQJYf9abN7jDMI-SXS_eV0c3RPuXomqEyTAj2z8ZEN7FPxyEJjR2GdYIrd7Iv1eGL613lSV0CjXi_P/pub?output=csv";
    const urlParams = new URLSearchParams(window.location.search);
    const idBusqueda = urlParams.get('id');

    if (idBusqueda) {
      document.getElementById('idEquipo').innerText = idBusqueda;

      Papa.parse(URL_CSV, {
        download: true,
        skipEmptyLines: true,
        complete: function(results) {
          const rows = results.data;
          const equipoEncontrado = rows.find(r => r && r[0] && r[0].trim() === idBusqueda.trim());

          if (equipoEncontrado) {
            document.getElementById('tipoEquipo').innerText = equipoEncontrado[1] ? equipoEncontrado[1].trim() : 'Equipo';
            document.getElementById('subtitulo').innerText = `Detalle del equipo ${idBusqueda}`;
            document.getElementById('marca').innerText = equipoEncontrado[2] ? equipoEncontrado[2].trim() : 'N/A';
            document.getElementById('modelo').innerText = equipoEncontrado[3] ? equipoEncontrado[3].trim() : 'N/A';
            document.getElementById('activo').innerText = equipoEncontrado[4] ? equipoEncontrado[4].trim() : 'N/A';
            document.getElementById('asignado').innerText = equipoEncontrado[5] ? equipoEncontrado[5].trim() : 'N/A';
            document.getElementById('historial').innerText = equipoEncontrado[6] ? equipoEncontrado[6].trim() : 'N/A';

            const caracteristicas = equipoEncontrado[7] ? equipoEncontrado[7].trim() : 'Sin características registradas.';
            document.getElementById('caracteristicas').innerHTML = `<p style="white-space: pre-line; margin: 0;">${caracteristicas}</p>`;

            document.getElementById('monitores').innerText = equipoEncontrado[8] ? equipoEncontrado[8].trim() : 'N/A';
            document.getElementById('perifericos').innerText = equipoEncontrado[9] ? equipoEncontrado[9].trim() : 'N/A';
          } else {
            document.getElementById('tipoEquipo').innerText = "Equipo no encontrado";
          }
        }
      });
    }
  </script>
</body>
</html>

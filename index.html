<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario de Equipos - APSORAD</title>
  
  <!-- CSS Bootstrap 5, DataTables y FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary-color: #13192B;
      --accent-color: #008080;
      --bg-color: #F8FAFC;
      --text-color: #2C3E50;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* ENCABEZADO INTEGRADO Y ELEGANTE */
    .navbar-custom {
      background: linear-gradient(135deg, #13192B 0%, #1E293B 100%);
      border-bottom: 3px solid var(--accent-color);
      padding: 14px 0;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    .brand-wrapper {
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
    }

    .brand-logo-box {
      background-color: #FFFFFF;
      padding: 6px 14px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .brand-logo-box img {
      height: 44px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .brand-title {
      color: #FFFFFF;
      font-size: 1.3rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.8px;
      line-height: 1.2;
    }

    .brand-subtitle {
      color: #008080;
      font-size: 0.82rem;
      font-weight: 600;
      display: block;
      letter-spacing: 0.5px;
    }

    .main-card {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #E2E8F0;
      box-shadow: 0 10px 25px rgba(0,0,0,0.03);
      padding: 28px;
      margin-top: 35px;
      margin-bottom: 40px;
    }

    .table-title {
      color: var(--primary-color);
      font-weight: 700;
      font-size: 1.6rem;
      border-left: 5px solid var(--accent-color);
      padding-left: 12px;
      margin-bottom: 25px;
    }

    table.dataTable thead th {
      background-color: var(--primary-color) !important;
      color: #ffffff !important;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.85rem;
      border: none !important;
      padding: 14px 16px !important;
    }

    table.dataTable tbody td {
      padding: 14px 16px !important;
      vertical-align: middle;
      border-bottom: 1px solid #E2E8F0;
    }

    .btn-id {
      background-color: #E0F2FE;
      color: #0369A1;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-block;
    }

    .btn-id:hover {
      background-color: var(--accent-color);
      color: #ffffff;
    }

    #loading {
      text-align: center;
      padding: 50px;
      font-weight: 600;
      color: var(--accent-color);
    }
  </style>
</head>
<body>

  <!-- Encabezado APSORAD -->
  <nav class="navbar navbar-custom">
    <div class="container justify-content-start">
      <a href="index.html" class="brand-wrapper">
        <div class="brand-logo-box">
          <img src="logo1.jpg" alt="APSORAD Logo">
        </div>
        <div>
          <h1 class="brand-title">APSORAD</h1>
          <span class="brand-subtitle">Control de Inventario de Equipos</span>
        </div>
      </a>
    </div>
  </nav>

  <!-- Contenedor Principal -->
  <div class="container">
    <div class="main-card">
      <h2 class="table-title">Inventario de Equipos</h2>
      
      <div id="loading">
        <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
        <p class="mt-3">Cargando inventario desde Google Sheets...</p>
      </div>

      <div class="table-responsive d-none" id="tableContainer">
        <table id="tablaInventario" class="table table-hover align-middle w-100">
          <thead>
            <tr>
              <th>ID</th>
              <th>Equipo</th>
              <th>Marca</th>
              <th>Modelo</th>
              <th>Asignado A</th>
            </tr>
          </thead>
          <tbody id="tablaCuerpo">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    const URL_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQQJYf9abN7jDMI-SXS_eV0c3RPuXomqEyTAj2z8ZEN7FPxyEJjR2GdYIrd7Iv1eGL613lSV0CjXi_P/pub?output=csv";

    Papa.parse(URL_CSV, {
      download: true,
      skipEmptyLines: true,
      complete: function(results) {
        const rows = results.data;
        let htmlContent = '';

        for (let i = 1; i < rows.length; i++) {
          const fila = rows[i];
          if (!fila || fila.length === 0) continue;

          const id = fila[0] ? fila[0].trim() : '';      // A: IDENTIFICACION
          const equipo = fila[1] ? fila[1].trim() : '';  // B: EQUIPO
          const marca = fila[2] ? fila[2].trim() : '';   // C: MARCA
          const modelo = fila[3] ? fila[3].trim() : '';  // D: MODELO
          const asignado = fila[5] ? fila[5].trim() : '';// F: ASIGNADO

          if (id && id.toUpperCase().startsWith('APSO')) {
            htmlContent += `
              <tr>
                <td><a href="equipo.html?id=${encodeURIComponent(id)}" class="btn-id"><i class="fa-solid fa-desktop me-1"></i> ${id}</a></td>
                <td>${equipo || 'N/A'}</td>
                <td>${marca || 'N/A'}</td>
                <td>${modelo || 'N/A'}</td>
                <td>${asignado || 'N/A'}</td>
              </tr>
            `;
          }
        }

        document.getElementById('tablaCuerpo').innerHTML = htmlContent;
        document.getElementById('loading').classList.add('d-none');
        document.getElementById('tableContainer').classList.remove('d-none');

        $('#tablaInventario').DataTable({
          "language": {
            "url": "//cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json"
          },
          "pageLength": 10,
          "responsive": true
        });
      },
      error: function(err) {
        console.error("Error al obtener datos:", err);
        document.getElementById('loading').innerHTML = '<p class="text-danger">Error al conectar con la hoja de Google Sheets.</p>';
      }
    });
  </script>
</body>
</html>
